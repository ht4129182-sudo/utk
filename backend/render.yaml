services:
  - type: web
    name: utkarsh-toss-book-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: utkarsh-toss-book-db
          property: connectionString

databases:
  - name: utkarsh-toss-book-db
    databaseName: utkarsh_toss_book
    user: utkarsh_user