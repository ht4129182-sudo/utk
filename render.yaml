services:
  - type: web
    name: utkarsh-toss-book
    env: node
    buildCommand: cd backend && npm install --legacy-peer-deps && cd ../frontend && npm install --legacy-peer-deps && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        value: utkarsh_toss_book_secret_key_2024
      - key: NODE_ENV
        value: production
