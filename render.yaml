services:
  - type: web
    name: utkarsh-toss-book
    env: node
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install --legacy-peer-deps --save && npm run build
    startCommand: node backend/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        value: utkarsh_toss_book_secret_key_2024
      - key: NODE_ENV
        value: production
